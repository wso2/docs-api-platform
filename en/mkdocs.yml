  - ai-gateway/1.0.0/assets/lib/highlightjs/highlight.min.js
  - https://8c140a8d-7209-401b-84ab-2aebe8deaa80.e1-us-east-azure.choreoapps.dev/theme.js
extra:
  show_repo_in_nav: false
  page_title_suffix: "API Platform Docs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wso2
  # Sections whose subtopic list is versioned. Each top-level nav section listed
  # here is rendered with a version selector; its direct children must be the
  # version groups (titled with the version string). See nav-item.html / theme.js.
  versioned_sections:
    AI Gateway:
      slug: ai-gateway
      default: "1.2.0"
      versions:
        - "1.2.0"
        - "1.1.0"
        - "1.0.0"
      # Shown under "Latest STS Version" in the dropdown; never the default.
      # Setting this also relabels the default as "Latest LTS Version".
      sts_versions:
        - "2026.09.24"
  # Choreo Connect gateway version referenced by {{ choreo_connect.* }}
  # placeholders in the API Manager 4.2.0 docs.
  choreo_connect:
    version: 1.2.0
    envoy_version: v1.24.1
    helm_chart:
      version: 1.2.0-1
      git_tag: v1.2.0.1
  # Top-level nav sections that only apply to a given doc version. They are
  # rendered hidden; theme.js reveals them while the current URL contains the
  # version as a path segment (e.g. /next/ai-workspace/... or
  # /api-gateway/next/...). See partials/nav-item.html and theme.js.
  version_scoped_navs:
    - title: Developer Portal
      version: "next"
    - title: AI Workspace
      version: "next"
  expanded_navs:
    - title: Cloud
      options:
        - verticle-line
    - title: MCP Servers
      options:
        - verticle-line-only
    - title: Monitor and Insights
      options:
        - verticle-line-only
    - title: API Monetization
      options:
        - verticle-line-only
    - title: Administer
      options:
        - verticle-line-only
    - title: Workflows
      options:
        - verticle-line-only
    - title: Developer Portal
      options:
        - verticle-line
    # Root-level (version-scoped) copy only; 'level: 1' keeps the AI Workspace
    # section nested under Cloud rendering as a regular collapsed item.
    - title: AI Workspace
      level: 1
      options:
        - verticle-line
    - title: API Manager
      options:
        - verticle-line
    - title: API Gateway
      options:
        - verticle-line
    - title: AI Gateway
      options:
        - verticle-line
    - title: Analytics
      options:
        - verticle-line
    - title: Monetization
      level: 1
      options:
        - verticle-line
    - title: Policy Hub
      options:
        - verticle-line
    - title: Guides
      options:
        - verticle-line
    - title: Samples
      options:
        - verticle-line
        - divider
    - title: Tools
      options:
        - verticle-line
