# Project information
site_name: "API Platform Documentation"
site_description: API Platform Documentation
site_author: WSO2
site_url: https://wso2.com/api-platform/docs


# Repository
repo_name: wso2/docs-bijira
repo_url: https://github.com/wso2/docs-bijira
edit_uri: https://github.com/wso2/docs-bijira/edit/main/en/docs/
dev_addr: localhost:8000

# Copyright
copyright: ©2025 WSO2 LLC.

# Configuration
watch:
  - theme/
  - docs/assets/

theme:
  name: material
  custom_dir: theme/material
  logo: assets/images/APIPlatformDocs.svg
  logo_light: assets/images/APIPlatformDocsWhite.svg
  font:
    text: Montserrat
  favicon: assets/images/favicon.png
  features:
    # Fetch pages with XHR and swap the content in place instead of reloading
    # the whole window. Per-page JavaScript must run from document$, not
    # DOMContentLoaded (see docs/assets/js/theme.js).
    - navigation.instant
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
  language: "en"
  palette:
    # Palette toggle for light mode
       - media: "(prefers-color-scheme: light)"
         scheme: default 
         toggle:
          icon: assets/libs/oxygen-ui-icons/1.7.3/crescent-bright-16.svg
          name: Switch to dark mode
      # Palette toggle for dark mode
       - media: "(prefers-color-scheme: dark)"
         scheme: slate
         toggle:
           icon: assets/libs/oxygen-ui-icons/1.7.3/sun-16.svg
           name: Switch to light mode

  icon:
    logo: logo
#Breaks build if there's a warning
strict: false
# Navigation
nav:
  - Overview: index.md
  - Get Started: get-started.md
  - Analytics:
    - Overview: analytics/overview.md
  - Monetization:
    - Overview: monetization/overview.md
    - Monetizing APIs:
        - Connect Stripe: monetization/getting-started.md
        - Manage Paid Subscription Plans: monetization/manage-paid-subscription-plans.md
    - Consume Monetized APIs:
        - Subscribe to a Paid Plan: monetization/subscribe-to-paid-plan.md
        - View Billing and Usage: monetization/view-billing-and-usage.md
  - Policy Hub:
    - Overview: policy-hub/overview.md
  - Guides:
    - Overview: guides/overview.md
    - By Use Case:
        - Govern LLM Traffic:
            - Set up a Governed Multi-Model LLM Proxy with Cost Controls and Failover: guides/ai-and-mcp/set-up-a-governed-multi-model-llm-proxy-with-cost-controls-and-failover.md
            - Enforce Token-Based Rate Limiting on an LLM Proxy: guides/ai-and-mcp/enforce-token-based-rate-limiting-on-an-llm-proxy.md
            - Block Prompt Injection and Unsafe Requests with LLM Proxy Guardrails: guides/ai-and-mcp/block-prompt-injection-and-unsafe-requests-with-llm-proxy-guardrails.md
            - Enforce a Consistent AI Persona with the Prompt Decorator Policy: guides/ai-and-mcp/using-prompt-decorator-policy.md
            - Observe LLM Traffic on the AI Gateway: guides/ai-and-mcp/observe-llm-traffic.md
        - Configure AI Coding Assistants with AI Gateway:
            - Claude Code:
                - Configure Claude Code with AI Gateway: guides/ai-and-mcp/ai-coding-assistants/claude-code-configuration-with-ai-gateway.md
                - Configure Claude Code with a Claude Subscription: guides/ai-and-mcp/ai-coding-assistants/claude-code-subscription-configuration-with-ai-gateway.md
            - Configure Google Gemini CLI with AI Gateway: guides/ai-and-mcp/ai-coding-assistants/gemini-cli-configuration-with-ai-gateway.md
            - Configure OpenAI Codex CLI with AI Gateway: guides/ai-and-mcp/ai-coding-assistants/codex-configuration-with-ai-gateway.md
            - Configure GitHub Copilot with AI Gateway: guides/ai-and-mcp/ai-coding-assistants/github-copilot-configuration-with-ai-gateway.md
        - Manage and Govern APIs:
            - Build an AI App with Claude Code that Calls Governed Backend APIs: guides/ai-and-mcp/build-ai-app-with-claude-code.md
        - Expose and Govern MCP Servers:
            - Convert a REST API into an MCP Tool and Use It in Claude Desktop: guides/ai-and-mcp/convert-rest-api-to-mcp-server.md
            - Expose a Multi-Step API Workflow as an MCP Tool: guides/ai-and-mcp/expose-a-multi-step-api-workflow-as-an-mcp-tool.md
            - Build an AI Agent That Uses Aggregated MCP Tools from Multiple APIs: guides/ai-and-mcp/build-ai-agent-with-multiple-mcp-servers.md
            - Publish MCP servers to a governed catalog using AI Workspace and API Portal and MCP Hub: guides/ai-and-mcp/publish-mcp-servers-to-a-governed-catalog.md
            - Reduce MCP Tool Poisoning Risk with the MCP Access Control Policy: guides/ai-and-mcp/block-mcp-tool-poisoning-with-the-mcp-access-control-policy.md
            - Observe MCP Traffic on the AI Gateway: guides/ai-and-mcp/observe-mcp-traffic.md
        - Discover APIs and MCP Servers:
            - Go from Zero to a Working API Call Using the Developer Portal: guides/developer-portal/api-discovery-and-tryout.md
            - Find and Connect to an Enterprise MCP Server from the MCP Hub: guides/ai-and-mcp/find-and-connect-to-an-enterprise-mcp-server-from-the-mcp-hub.md
        - Monetize APIs and MCP Tools:
            - API Monetization: guides/monetization/api-monetization.md
            - MCP Tool Monetization: guides/monetization/mcp-tool-monetization.md
        - Connect Third-Party Gateways:
            - Discover APIs from Amazon API Gateway: guides/gateway-federation/discover-apis-from-aws-api-gateway.md
        - Expose Real-Time APIs:
            - Build a WebSocket-Based Real-Time Notification System: guides/websocket/build-a-websocket-notification-system.md
            - Build an AI Agent that Reacts to WebSocket Notifications: guides/websocket/build-an-ai-agent-for-websocket-notifications.md
    - By Service Provider:
        - AWS: guides/service-providers/aws.md
        - Azure: guides/service-providers/azure.md
        - Anthropic: guides/service-providers/anthropic.md
        - OpenAI: guides/service-providers/openai.md
        - Google: guides/service-providers/google.md
        - Mistral: guides/service-providers/mistral.md
        - GitHub: guides/service-providers/github.md
        - Stripe: guides/service-providers/stripe.md
  - Tools:
    - API Platform CLI:
        - Quick Start Guide: tools/cli/quick-start-guide.md
        - Customizing Gateway Policies: tools/cli/customizing-gateway-policies.md
        - Reference: tools/cli/reference.md
    - VS Code for API Design:
        - Quick Start Guide: tools/vscode-api-design/getting-started.md
        - Design APIs: tools/vscode-api-design/design-apis.md
        - Govern APIs: tools/vscode-api-design/govern-apis.md
        - End-to-End Tutorial: tools/vscode-api-design/end-to-end-tutorial.md
    - Arazzo MCP Generator CLI:
        - Quick Start Guide: tools/arazzo-mcp-gen-cli/quick-start-guide.md
        - Reference: tools/arazzo-mcp-gen-cli/reference.md
    - VS Code Arazzo Visualizer:
        - Overview: tools/vscode-arazzo-visualizer/getting-started.md
        - Quick Start Guide: tools/vscode-arazzo-visualizer/quick-start-guide.md

# Extensions
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list
  - md_in_html
hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - glightbox
  - open-in-new-tab
  - markdownextradata: {}
  - redirects:
      redirect_maps: {}  # Do not add redirects here. Add them to redirects.yml instead.
extra_css:
  - assets/css/extra.css
  - assets/lib/highlightjs/default.min.css
  - assets/css/theme.css
  - assets/css/api-manager-legacy.css
  - assets/lib/json-formatter/json-formatter.css
extra_javascript:
  - assets/lib/json-formatter/json-formatter.umd.js
  - assets/lib/highlightjs/highlight.min.js
  - https://8c140a8d-7209-401b-84ab-2aebe8deaa80.e1-us-east-azure.choreoapps.dev/theme.js
extra:
  show_repo_in_nav: false
  page_title_suffix: "API Platform Docs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wso2
  # Sections whose subtopic list is versioned. Each top-level nav section listed
  # here is rendered with a version selector; its direct children must be the
  # version groups (titled with the version string). See nav-item.html / theme.js.
  versioned_sections: {}
  unversioned_sections:
    Analytics:
      slug: analytics
    Monetization:
      slug: monetization
    Policy Hub:
      slug: policy-hub
    Guides:
      slug: guides
    Tools:
      slug: tools
  # Choreo Connect gateway version referenced by {{ choreo_connect.* }}
  # placeholders in the API Manager 4.2.0 docs.
  choreo_connect:
    version: 1.2.0
    envoy_version: v1.24.1
    helm_chart:
      version: 1.2.0-1
      git_tag: v1.2.0.1
  # Top-level nav sections that only apply to a given doc version. They are
  # rendered hidden; theme.js reveals them while the current URL contains the
  # version as a path segment (e.g. /next/ai-workspace/... or
  # /api-gateway/next/...). See partials/nav-item.html and theme.js.
  version_scoped_navs:
    - title: Developer Portal
      version: "next"
    - title: AI Workspace
      version: "next"
  expanded_navs:
