# Project information
site_name: "API Platform Documentation"
site_description: API Platform Documentation
site_author: WSO2
site_url: https://wso2.com/api-platform/docs


# Repository
repo_name: wso2/docs-bijira
repo_url: https://github.com/wso2/docs-bijira
edit_uri: https://github.com/wso2/docs-bijira/edit/main/en/docs/
dev_addr: localhost:8000

# Copyright
copyright: ©2025 WSO2 LLC.

# Configuration
watch:
  - theme/
  - docs/assets/

theme:
  name: material
  custom_dir: theme/material
  logo: assets/images/APIPlatformDocs.svg
  logo_light: assets/images/APIPlatformDocsWhite.svg
  font:
    text: Montserrat
  favicon: assets/images/favicon.png
  features:
    # Fetch pages with XHR and swap the content in place instead of reloading
    # the whole window. Per-page JavaScript must run from document$, not
    # DOMContentLoaded (see docs/assets/js/theme.js).
    - navigation.instant
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
  language: "en"
  palette:
    # Palette toggle for light mode
       - media: "(prefers-color-scheme: light)"
         scheme: default 
         toggle:
          icon: assets/libs/oxygen-ui-icons/1.7.3/crescent-bright-16.svg
          name: Switch to dark mode
      # Palette toggle for dark mode
       - media: "(prefers-color-scheme: dark)"
         scheme: slate
         toggle:
           icon: assets/libs/oxygen-ui-icons/1.7.3/sun-16.svg
           name: Switch to light mode

  icon:
    logo: logo
#Breaks build if there's a warning
strict: false
