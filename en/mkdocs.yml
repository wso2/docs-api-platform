  # In-development 'next' doc sets, only shown in the nav while browsing a
  # /next/ (or <component>/next/) URL — see extra.version_scoped_navs.
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list
hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - glightbox
  - open-in-new-tab
  - markdownextradata: {}
  - exclude:
      glob:
        - "ai-gateway/*/README.md"   # the folder's developer README; the version root redirects to overview
  - redirects:
      redirect_maps: {}  # Do not add redirects here. Add them to redirects.yml instead.
extra_css:
  - assets/css/extra.css
  - ai-gateway/1.0.0/assets/lib/highlightjs/default.min.css
  - assets/css/theme.css
  - ai-gateway/1.0.0/assets/css/api-manager-legacy.css
  - ai-gateway/1.0.0/assets/lib/json-formatter/json-formatter.css
extra_javascript:
