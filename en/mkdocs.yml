# Extensions
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list
hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - glightbox
  - open-in-new-tab
  - markdownextradata: {}
  - redirects:
      redirect_maps:
        # API Portal: overview + documentation pages merged into Browse APIs
        api-portal/next/discover-apis/api-overview.md: api-portal/next/discover-apis/browse-apis.md
        api-portal/next/discover-apis/api-documentations.md: api-portal/next/discover-apis/browse-apis.md
        # API Portal: files relocated to match their nav sections
        api-portal/next/discover-apis/ai-agent-discovery.md: api-portal/next/ai-agent-discovery.md
        api-portal/next/mcp-servers/mcp-registry.md: api-portal/next/mcp-registry.md
