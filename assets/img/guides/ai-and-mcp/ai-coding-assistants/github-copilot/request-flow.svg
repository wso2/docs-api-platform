<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GitHub Copilot request flow through the WSO2 AI Gateway</title>
  <desc>GitHub Copilot CLI and GitHub Copilot in VS Code send requests with the X-API-Key header to the App LLM Proxy on the WSO2 AI Gateway. The proxy checks the API key, applies policies, and publishes analytics. The OpenAI LLM provider adds the OpenAI API key and forwards the request to OpenAI. Responses stream back to GitHub Copilot along the same path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="345" fill="#FFFFFF"/>

  <!-- Clients -->
  <rect x="30" y="85" width="200" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="130" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">GitHub Copilot CLI</text>
  <text x="130" y="138" text-anchor="middle" font-size="13" fill="#5F5E5A">Terminal</text>

  <rect x="30" y="200" width="200" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="130" y="231" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">GitHub Copilot</text>
  <text x="130" y="253" text-anchor="middle" font-size="13" fill="#5F5E5A">in VS Code</text>

  <!-- Gateway container -->
  <rect x="290" y="35" width="480" height="250" rx="10" fill="#FFF8F2" stroke="#E8762D" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="310" y="62" font-size="14" font-weight="600" fill="#9A4A12">WSO2 AI Gateway</text>

  <!-- App LLM Proxy -->
  <rect x="315" y="95" width="205" height="150" rx="8" fill="#FFFFFF" stroke="#E8762D" stroke-width="1.4"/>
  <text x="417" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">App LLM Proxy</text>
  <text x="417" y="158" text-anchor="middle" font-size="13" fill="#5F5E5A">Checks the API key</text>
  <text x="417" y="182" text-anchor="middle" font-size="13" fill="#5F5E5A">Applies policies</text>
  <text x="417" y="206" text-anchor="middle" font-size="13" fill="#5F5E5A">Publishes analytics</text>

  <!-- OpenAI LLM provider -->
  <rect x="548" y="125" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#E8762D" stroke-width="1.4"/>
  <text x="648" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">OpenAI LLM provider</text>
  <text x="648" y="184" text-anchor="middle" font-size="13" fill="#5F5E5A">Adds the OpenAI API key</text>

  <!-- OpenAI -->
  <rect x="805" y="130" width="165" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="887" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">OpenAI</text>
  <text x="887" y="186" text-anchor="middle" font-size="13" fill="#0F6E56">Runs the model</text>

  <!-- Request arrows -->
  <path d="M230 120 L313 150" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M230 235 L313 200" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="258" y="181" text-anchor="middle" font-size="12" fill="#444441">X-API-Key</text>
  <path d="M520 170 L546 170" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M748 170 L803 170" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="530" y="320" text-anchor="middle" font-size="13" fill="#5F5E5A">Responses stream back to GitHub Copilot along the same path.</text>
</svg>
